<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Datacenter Siege</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pirata+One&family=IBM+Plex+Mono:wght@400;600;700&family=Karla:wght@400;600;700&display=swap">
<style>
  /* Single deliberate look: a night-green field desk around a painted valley. */
  :root {
    --ink: #121813;
    --panel: #1b241d;
    --line: #34443a;
    --parch: #efe6cf;
    --paper: #f3edd8;
    --paper-ink: #1b1f1a;
    --muted: #9fb0a2;
    --hazard: #f2b233;
    --money: #74b36d;
    --rust: #b23a22;
    --led: #5ce1e6;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    touch-action: manipulation;
    background: var(--ink);
    color: var(--parch);
    font-family: Karla, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  .app {
    height: 100%;
    max-width: 1680px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding-block: 10px;
    padding-inline: 16px;
  }

  /* HUD */
  .hud {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr) minmax(0, 1fr) auto;
    gap: 8px 26px;
    align-items: center;
  }
  .brand { display: flex; flex-direction: column; gap: 2px; }
  .brand-name { font-family: "Pirata One", "UnifrakturCook", Georgia, serif; font-size: 32px; line-height: .95; }
  .mono, .permit, .mlabel, .wind, .help, .toast {
    font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  }
  .permit { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .mlabel {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
  }
  .mlabel b { font-size: 16px; color: var(--parch); letter-spacing: 0; font-variant-numeric: tabular-nums; }
  .bar { height: 11px; background: #0a0f0b; border: 1px solid var(--line); margin-block: 5px 4px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; transition: width .25s ease-out; }
  .build .bar i { background: repeating-linear-gradient(-45deg, var(--hazard) 0 7px, #26221a 7px 14px); }
  .budget .bar i { background: var(--money); }
  .budget.low .bar i { background: var(--rust); }
  .meter small { font-size: 12.5px; color: var(--muted); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .wind { text-align: right; display: flex; flex-direction: column; gap: 2px; font-variant-numeric: tabular-nums; }
  .wind span { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .wind b { font-size: 16px; }
  .wind small { font-size: 12px; color: var(--muted); }
  .wind small.ready { color: var(--hazard); }
  .audio { display: flex; gap: 6px; justify-content: flex-end; }
  .mute { background: transparent; color: var(--muted); cursor: pointer;
    border: 1px solid var(--line); padding: 2px 8px; margin-top: 2px;
    font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: .06em; text-transform: uppercase;
  }
  .mute:hover { color: var(--parch); border-color: var(--muted); }
  .mute:focus-visible { outline: 2px solid var(--hazard); outline-offset: 2px; }
  .mute[aria-pressed="true"] { color: var(--rust); border-color: var(--rust); }

  /* Stage */
  .stage { flex: 1; min-height: 0; position: relative; display: grid; place-items: center; }
  .frame { position: relative; box-shadow: 0 0 0 1px var(--line), 0 24px 60px rgba(0,0,0,.5); }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
  .caption {
    position: absolute; left: 50%; top: 4%; transform: translateX(-50%);
    width: 88%; text-align: center; text-wrap: balance;
    font-family: "Pirata One", Georgia, serif; font-size: clamp(17px, 2.5vw, 36px); line-height: 1.05;
    color: #fffaf0; text-shadow: 0 2px 14px rgba(0,0,0,.55), 0 0 2px rgba(0,0,0,.6);
    opacity: 0; transition: opacity .7s; pointer-events: none;
  }
  .caption.show { opacity: 1; }
  .toast {
    position: absolute; left: 50%; bottom: 7%; transform: translateX(-50%);
    font-size: clamp(11px, 1.25vw, 15px); font-weight: 600; white-space: nowrap;
    background: rgba(18,24,19,.88); color: var(--hazard);
    padding: 6px 12px; border-left: 3px solid var(--hazard);
    opacity: 0; transition: opacity .2s; pointer-events: none;
  }
  .toast.show { opacity: 1; }

  /* Notice-board overlay */
  .overlay {
    position: absolute; inset: 0; overflow: auto;
    display: grid; place-items: center; padding: 16px;
    background: rgba(8,12,9,.38);
  }
  .notice {
    width: 100%; max-width: 520px; background: var(--paper); color: var(--paper-ink);
    border: 1px solid #cfc5a6; box-shadow: 0 20px 70px rgba(0,0,0,.55);
    animation: pin .45s cubic-bezier(.2,.9,.3,1.2);
  }
  @keyframes pin { from { transform: translateY(14px) rotate(-1deg); opacity: 0; } to { transform: none; opacity: 1; } }
  .notice-head {
    display: flex; justify-content: space-between; gap: 12px;
    background: var(--hazard); color: #15140e; padding: 8px 20px;
    font: 700 11.5px/1.2 "IBM Plex Mono", ui-monospace, monospace; letter-spacing: .14em; text-transform: uppercase;
  }
  .notice-body { padding: 18px 22px 22px; display: flex; flex-direction: column; gap: 14px; }
  .notice h1 {
    margin: 0; font-family: "Pirata One", Georgia, serif; font-weight: 400;
    font-size: clamp(42px, 7vw, 66px); line-height: .88; text-wrap: balance;
  }
  .lede { margin: 0; font-size: 16px; line-height: 1.45; max-width: 60ch; }
  .facts {
    margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 3px 16px;
    font: 12.5px/1.45 "IBM Plex Mono", ui-monospace, monospace;
    border-block: 1px solid #d3c9aa; padding-block: 10px;
  }
  .facts dt { text-transform: uppercase; letter-spacing: .06em; color: #6b6a58; }
  .facts dd { margin: 0; font-variant-numeric: tabular-nums; }
  .rules { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 7px; font-size: 14.5px; line-height: 1.4; }
  .rules b { font-family: "IBM Plex Mono", monospace; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; display: inline-block; min-width: 42px; }
  .stamp {
    align-self: flex-start; transform: rotate(-6deg); margin-block: 2px;
    border: 3px solid var(--rust); color: var(--rust); padding: 5px 12px;
    font: 700 14px "IBM Plex Mono", monospace; letter-spacing: .12em; text-transform: uppercase;
    mix-blend-mode: multiply;
  }
  .stamp.green { border-color: #2f6b3a; color: #2f6b3a; }
  .diff { border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .diff legend { font: 600 11px "IBM Plex Mono", monospace; letter-spacing: .08em; text-transform: uppercase; color: #6b6a58; padding: 0; margin-bottom: 6px; }
  .seg { display: flex; border: 1.5px solid var(--paper-ink); }
  .seg label {
    flex: 1; text-align: center; padding: 8px 6px; cursor: pointer;
    font: 600 13px "IBM Plex Mono", monospace; text-transform: uppercase; letter-spacing: .06em;
  }
  .seg label + label { border-left: 1.5px solid var(--paper-ink); }
  .seg input { position: absolute; opacity: 0; pointer-events: none; }
  .seg label:has(input:checked) { background: var(--paper-ink); color: var(--paper); }
  .seg label:has(input:focus-visible) { outline: 3px solid var(--hazard); outline-offset: -3px; }
  .go {
    font: 700 15px "IBM Plex Mono", monospace; text-transform: uppercase; letter-spacing: .1em;
    background: var(--paper-ink); color: var(--paper); border: 0; padding: 14px 18px; cursor: pointer;
    transition: background .15s;
  }
  .go:hover { background: #7a2a18; }
  .go:focus-visible { outline: 3px solid var(--hazard); outline-offset: 2px; }
  .keys { margin: 0; font: 12px/1.4 "IBM Plex Mono", monospace; color: #6b6a58; text-align: center; }

  .help { font-size: 12px; color: var(--muted); text-align: center; letter-spacing: .02em; }
  .help kbd { font-family: inherit; border: 1px solid var(--line); padding: 0 5px; border-radius: 3px; color: var(--parch); }

  @media (max-width: 820px) {
    .hud { grid-template-columns: 1fr 1fr; gap: 8px 16px; }
    .brand { grid-column: 1 / -1; flex-direction: row; align-items: baseline; justify-content: space-between; }
    .brand-name { font-size: 24px; }
    .wind { grid-column: 1 / -1; flex-direction: row; justify-content: space-between; align-items: baseline; text-align: left; }
    .meter small { font-size: 11px; }
  }
  /* Phone held sideways: the height is what's scarce, so the HUD moves into a
     sidebar next to the field and the footer goes away. */
  @media (orientation: landscape) and (max-height: 500px) {
    .app {
      flex-direction: row; gap: 12px; max-width: none;
      padding-block: 6px;
      padding-inline: max(12px, env(safe-area-inset-left, 0px)) max(12px, env(safe-area-inset-right, 0px));
    }
    .stage { order: 1; flex: 1; min-width: 0; }
    .hud {
      order: 2; flex: none; width: 150px; overflow-y: auto;
      grid-template-columns: 1fr; align-content: center; gap: 10px;
    }
    .brand, .wind { grid-column: auto; }
    .brand-name { font-size: 20px; }
    .permit, .meter small, .help { display: none; }
    .mlabel { font-size: 10px; }
    .mlabel b { font-size: 14px; }
    .bar { height: 9px; margin-block: 3px 0; }
    .wind { flex-direction: column; align-items: flex-start; gap: 1px; }
    .wind b { font-size: 14px; }
    .audio { justify-content: flex-start; flex-wrap: wrap; margin-top: 4px; }
    .mute { padding: 5px 8px; }
    .overlay { position: fixed; inset: 0; z-index: 10; padding: 8px; }
    .notice-head { padding: 6px 16px; }
    .notice-body { padding: 12px 16px 14px; gap: 10px; }
    .notice h1 { font-size: 38px; }
    .lede { font-size: 14px; }
    .facts { font-size: 11.5px; padding-block: 6px; }
    .rules { font-size: 13px; gap: 4px; }
    .go { padding: 11px 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .notice { animation: none; }
    .caption, .toast, .bar i { transition: none; }
  }
</style>

<div class="app">
  <header class="hud">
    <div class="brand">
      <span class="brand-name">Datacenter Siege</span>
      <span class="permit">Permit DC-4471 · Cedar Creek</span>
    </div>
    <div class="meter build">
      <div class="mlabel"><span>Construction</span><b id="buildPct">0%</b></div>
      <div class="bar"><i id="buildBar"></i></div>
      <small id="buildSub">0 / 72 sections standing</small>
    </div>
    <div class="meter budget" id="budgetMeter">
      <div class="mlabel"><span>Developer budget</span><b id="budgetVal">$3.36B</b></div>
      <div class="bar"><i id="budgetBar" style="width:100%"></i></div>
      <small id="budgetSub">Each wrecked section costs $30M to replace</small>
    </div>
    <div class="wind">
      <span>Wind</span>
      <b id="windVal">calm</b>
      <small id="reloadVal">Loaded</small>
      <div class="audio">
        <button class="mute" id="musicBtn" type="button" aria-pressed="false">Music on</button>
        <button class="mute" id="muteBtn" type="button" aria-pressed="false">Sound on</button>
      </div>
    </div>
  </header>

  <main class="stage" id="stage">
    <div class="frame" id="frame">
      <canvas id="cv" aria-label="Siege field: trebuchet on the left, construction site on the right"></canvas>
      <div class="caption" id="caption" aria-live="polite"></div>
      <div class="toast" id="toast" aria-live="polite"></div>
    </div>
    <div class="overlay" id="overlay"></div>
  </main>

  <footer class="help">
    Drag anywhere and pull back to aim · release to fire &nbsp;·&nbsp; <kbd>↑</kbd><kbd>↓</kbd> angle &nbsp;<kbd>←</kbd><kbd>→</kbd> power &nbsp;<kbd>Space</kbd> fire &nbsp;<kbd>M</kbd> sound &nbsp;<kbd>B</kbd> music  </footer>
</div>

<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const cv = $("cv"), ctx = cv.getContext("2d"), frameEl = $("frame"), stageEl = $("stage");

  // ---------- World constants ----------
  const W = 1600, H = 900, HORIZON = 600, GROUND = 770;
  const COLS = 9, ROWS = 8, N = COLS * ROWS, BW = 42, BH = 36, BX = 1090;
  const BLOCK_HP = 4, COST = 30, VMAX = 1020, GRAV = 900;
  const TX = 180, TPY = 600, ARM = 150, ARM_S = 46, SLING = 50;
  const REST = Math.PI * 0.82, RELEASE = Math.PI * 1.65;
  const LAUNCH = { x: TX + Math.cos(RELEASE) * (ARM + SLING), y: TPY + Math.sin(RELEASE) * (ARM + SLING) };
  const CRANE_X = 1585, JIB_Y = 372;
  // Crane slew: the jib turns in plan view, drawn foreshortened by DEPTH.
  const JIB_R = 520, JIB_MIN = 60, DEPTH = 0.32, TRAVEL_Y = JIB_Y + 66;
  // Deliveries: each truck parks on the site road with CARGO sections aboard.
  const CARGO = 8, TRUCK_TURN = 1.8, TRUCK_X = 1474, TRUCK_Y = 836, TRUCK_BED = TRUCK_Y - 34;
  const DIFF = {
    // build = seconds per section overall; bundle = sections the crane lifts per trip.
    easy:   { build: 1.0,  extra: 34, wind: 30, bundle: 2, label: "Easy" },
    normal: { build: 0.78, extra: 42, wind: 55, bundle: 2, label: "Normal" },
    hard:   { build: 0.6,  extra: 50, wind: 85, bundle: 3, label: "Hard" },
  };
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

  // ---------- Helpers ----------
  const clamp = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, t) => a + (b - a) * t;
  const easeIn = (t) => t * t;
  const easeOut = (t) => 1 - (1 - t) * (1 - t);
  const easeInOut = (t) => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
  const rand = (a, b) => a + Math.random() * (b - a);
  function mulberry(a) {
    return function () {
      a |= 0; a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const hexCache = new Map();
  function rgb(h) {
    let v = hexCache.get(h);
    if (!v) { v = [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; hexCache.set(h, v); }
    return v;
  }
  // Tint a nature color: haze pushes toward dust, night toward deep blue.
  function T(h, hk = 1, nk = 0.62) {
    const A = rgb(h), hz = S.haze * hk * 0.55, nt = S.night * nk;
    let r = A[0] + (168 - A[0]) * hz, g = A[1] + (158 - A[1]) * hz, b = A[2] + (138 - A[2]) * hz;
    r += (18 - r) * nt; g += (24 - g) * nt; b += (46 - b) * nt;
    return `rgb(${r | 0},${g | 0},${b | 0})`;
  }
  const TN = (h) => T(h, 0, 0.55);
  function ell(x, y, rx, ry, rot = 0) {
    ctx.beginPath(); ctx.ellipse(x, y, Math.max(0.1, rx), Math.max(0.1, ry), rot, 0, Math.PI * 2); ctx.fill();
  }
  function line(x1, y1, x2, y2) { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
  const depthK = (y) => 0.55 + ((y - HORIZON) / 300) * 0.75;
  const money = (m) => (m >= 1000 ? "$" + (m / 1000).toFixed(2) + "B" : "$" + Math.max(0, Math.round(m)) + "M");
  function streamAt(y) {
    const t = (y - HORIZON) / 300;
    return { x: 1150 - t * 430 + Math.sin(t * 7) * 40, w: 5 + t * t * 80 };
  }

  // ---------- Sound (synthesized with Web Audio, no files) ----------
  const Sfx = (() => {
    let ac = null, master = null, noiseBuf = null, muted = false, musicMuted = false;
    let sfxBus = null, musicBus = null, musicIn = null, ambBus = null, siteBus = null;
    let lastClank = 0, lastSaw = 0;
    const MUSIC_VOL = 0.26, AMB_VOL = 0.5;
    try { muted = localStorage.getItem("dcsiege-mute") === "1"; musicMuted = localStorage.getItem("dcsiege-music") === "0"; } catch (e) {}
    function ensure() {
      if (!ac) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        ac = new AC();
        master = ac.createGain();
        master.gain.value = muted ? 0 : 0.75;
        const comp = ac.createDynamicsCompressor();
        master.connect(comp); comp.connect(ac.destination);
        noiseBuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
        const d = noiseBuf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
        sfxBus = ac.createGain(); sfxBus.connect(master);
        ambBus = ac.createGain(); ambBus.gain.value = AMB_VOL; ambBus.connect(master);
        siteBus = ac.createGain(); siteBus.gain.value = 0.8; siteBus.connect(master);
        musicBus = ac.createGain(); musicBus.gain.value = musicMuted ? 0 : MUSIC_VOL; musicBus.connect(master);
        // Music gets a generated hall reverb.
        musicIn = ac.createGain(); musicIn.connect(musicBus);
        const verb = ac.createConvolver(), len = ac.sampleRate * 2.4, ir = ac.createBuffer(2, len, ac.sampleRate);
        for (let c = 0; c < 2; c++) { const ch = ir.getChannelData(c); for (let i = 0; i < len; i++) ch[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3); }
        verb.buffer = ir;
        const wet = ac.createGain(); wet.gain.value = 0.35;
        musicIn.connect(verb); verb.connect(wet); wet.connect(musicBus);
        startAmbient();
        setInterval(schedule, 50);
        document.addEventListener("visibilitychange", () => { if (document.hidden) ac.suspend(); else ac.resume(); });
      }
      if (ac.state === "suspended" && !document.hidden) ac.resume();
      return ac;
    }
    const ready = () => ac && !muted && ac.state === "running";
    function out(pan, bus = sfxBus) {
      if (ac.createStereoPanner) { const p = ac.createStereoPanner(); p.pan.value = clamp(pan, -1, 1); p.connect(bus); return p; }
      return bus;
    }
    function shape(g, t, attack, peak, decay) {
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(peak, t + attack);
      g.gain.exponentialRampToValueAtTime(0.0001, t + attack + decay);
    }
    function burst({ at = 0, time, dur, filter = "lowpass", f0, f1 = f0, q = 1, peak, attack = 0.004, pan = 0, bus }) {
      const t = time ?? ac.currentTime + at, src = ac.createBufferSource(), bq = ac.createBiquadFilter(), g = ac.createGain();
      src.buffer = noiseBuf; bq.type = filter; bq.Q.value = q;
      bq.frequency.setValueAtTime(f0, t); bq.frequency.exponentialRampToValueAtTime(f1, t + attack + dur);
      shape(g, t, attack, peak, dur);
      src.connect(bq); bq.connect(g); g.connect(out(pan, bus));
      src.start(t, Math.random() * 1.2); src.stop(t + attack + dur + 0.05);
    }
    function tone({ at = 0, time, type = "sine", f0, f1 = f0, dur, peak, attack = 0.004, pan = 0, cut = 0, bus }) {
      const t = time ?? ac.currentTime + at, o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + attack + dur);
      shape(g, t, attack, peak, dur);
      if (cut) { const f = ac.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = cut; o.connect(f); f.connect(g); }
      else o.connect(g);
      g.connect(out(pan, bus));
      o.start(t); o.stop(t + attack + dur + 0.05);
    }
    const panOf = (x) => ((x / W) * 2 - 1) * 0.7;

    // ----- Music: a step sequencer that follows the round -----
    const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);
    const SONGS = {
      // D major, I–vi–IV–V
      pastoral: { bpm: 80, chords: [[62, 66, 69], [59, 62, 66], [55, 59, 62], [57, 61, 64]], roots: [38, 35, 31, 33] },
      // D minor, i–VI–VII–V
      siege: { bpm: 96, chords: [[62, 65, 69], [58, 62, 65], [60, 64, 67], [57, 61, 64]], roots: [38, 34, 36, 33] },
      // D Phrygian with a chromatic bass: i–bII–i–vii°. Takes over as the hall rises.
      dark: { chords: [[62, 65, 69], [63, 67, 70], [62, 65, 69], [61, 64, 67]], roots: [38, 39, 38, 37] },
      // D minor, i–iv–i–V
      dirge: { bpm: 54, chords: [[62, 65, 69], [55, 58, 62], [62, 65, 69], [57, 61, 64]], roots: [38, 31, 38, 33] },
    };
    const PENTA = [74, 76, 78, 81, 83, 86];
    let nextT = 0, step = 0, bar = 0, mood = "pastoral";
    function moodFor() {
      if (!S) return "pastoral";
      if (S.state === "build") return "siege";
      if (S.state === "collapse") return "silence";
      if (S.state === "complete" || S.state === "lost") return "dirge";
      return "pastoral";
    }
    function schedule() {
      if (!ac || ac.state !== "running") return;
      if (nextT < ac.currentTime) nextT = ac.currentTime + 0.05;
      while (nextT < ac.currentTime + 0.2) {
        const m = moodFor();
        if (m !== mood && (step === 0 || m === "silence" || m === "dirge" || mood === "silence")) { mood = m; step = 0; bar = 0; }
        const prog = S ? clamp(S.maxP) : 0;

    const pluck = (m, t, g, dur) => tone({ time: t, type: "triangle", f0: mtof(m), dur, peak: g, attack: 0.004, bus: musicIn });
    const bassNote = (m, t, g, dur, type = "sine", cut = 0) => tone({ time: t, type, f0: mtof(m), dur, peak: g, attack: 0.01, cut, bus: musicIn });
    function pad(chord, t, len, g, type, cut, spread = 5) {

    function taiko(t, g) {

    // A wordless choir: sawtooths through two vowel formants.

    function playStep(m, s, b, t, sd, prog) {
      // "evil" climbs from 0 at a quarter built to 1 at nine-tenths built.
      const evil = m === "siege" ? clamp((prog - 0.25) / 0.65) : 0;
      const song = m === "siege" && evil > 0.2 ? SONGS.dark : SONGS[m];

        if ([0, 3, 6, 10, 12].includes(s) && Math.random() < 0.85) pluck(ch[((s / 3) | 0) % 3] + 12, t, 0.04, 0.8);
        if (b % 2 === 1 && s % 4 === 2 && Math.random() < 0.4) pluck(PENTA[(Math.random() * PENTA.length) | 0] + 12, t, 0.03, 1.3);
      } else if (m === "siege") {

        // Tritone drone under everything.
        if (evil > 0.3 && s === 0) bassNote(root + 6, t, 0.02 + evil * 0.03, sd * 15, "sawtooth", 320);
        // Cold machine bleeps: the datacenter waking up.
        if (evil > 0.45 && s % 2 === 1 && Math.random() < 0.55) {
          const n = root + [36, 42, 37, 43][(Math.random() * 4) | 0];

    }

    // ----- Ambience: continuous beds whose levels follow the valley -----
    let amb = null, ambAcc = 0;
    function loopNoise() { const s = ac.createBufferSource(); s.buffer = noiseBuf; s.loop = true; s.start(0, Math.random() * 1.9); return s; }

      loopNoise().connect(stF); stF.connect(stG); stG.connect(out(0.05, ambBus));
      const bbG = silentGain(), bbF = filt("bandpass", 2400, 4);
      loopNoise().connect(bbF); bbF.connect(bbG); bbG.connect(out(0.1, ambBus));
      // Wind through the trees.

      loopNoise().connect(wnF); wnF.connect(wnG); wnG.connect(ambBus);

      for (const f of [46, 49.5]) { const o = ac.createOscillator(); o.type = "sawtooth"; o.frequency.value = f; o.connect(mF); o.start(); }

      crO.type = "sawtooth"; crO.frequency.value = 70; crO.connect(crF); crF.connect(crG); crG.connect(out(0.55, siteBus)); crO.start();
      amb = { stG, bbG, bbF, wnG, wnF, mG, hG, crG, crO, birdT: 1, beepT: 0, jackT: 3, hammerT: 2, sawT: 7, trolley: null, truckState: "wait" };
    }

    // ----- Construction site one-shots -----
    const sitePan = () => 0.35 + Math.random() * 0.4;
    function jackhammer(len) {
      const t0 = ac.currentTime + 0.02, pan = sitePan();
      for (let t = 0; t < len; t += 0.052) {
        burst({ time: t0 + t, dur: 0.028, filter: "bandpass", f0: 700 + Math.random() * 300, q: 0.9, peak: 0.06, attack: 0.002, pan, bus: siteBus });
        tone({ time: t0 + t, f0: 90, f1: 60, dur: 0.03, peak: 0.05, attack: 0.002, pan, bus: siteBus });
      }
    }
    function hammering(n) {
      const t0 = ac.currentTime + 0.02, pan = sitePan(), f = 1500 + Math.random() * 700;
      for (let i = 0; i < n; i++) {
        const t = t0 + i * (0.32 + Math.random() * 0.08);
        tone({ time: t, type: "triangle", f0: f, f1: f * 0.97, dur: 0.16, peak: 0.03, attack: 0.001, pan, bus: siteBus });
        burst({ time: t, dur: 0.02, filter: "highpass", f0: 2800, peak: 0.05, attack: 0.001, pan, bus: siteBus });
      }
    }

      const t = ac.currentTime + 0.02, pan = sitePan();

      for (let i = 0; i < n; i++) {

    }
    function ambient(dt) {

      amb.bbF.frequency.setTargetAtTime(1800 + Math.random() * 1600, now, 0.05);
      const gust = 0.7 + 0.3 * Math.sin(S.time * 0.35) + 0.15 * Math.sin(S.time * 1.3);

    return {
      unlock: ensure,
      ambient: (dt) => { if (ac) ambient(dt); },
      get muted() { return muted; },
      get musicMuted() { return musicMuted; },
      toggle() {
        muted = !muted;

        return muted;
      },
      toggleMusic() {
        musicMuted = !musicMuted;
        try { localStorage.setItem("dcsiege-music", musicMuted ? "0" : "1"); } catch (e) {}
        if (ensure()) musicBus.gain.setTargetAtTime(musicMuted ? 0 : MUSIC_VOL, ac.currentTime, 0.1);
        return musicMuted;
      },
      // Rope creak while the arm swings, a thunk against the crossbar, then the whoosh of the rock.
      launch(power) {
        if (!ready()) return;
        const p = -0.7;

        burst({ dur: 0.22, filter: "bandpass", f0: 700, f1: 300, q: 6, peak: 0.12, attack: 0.03, pan: p });

      },
      // Rock into dirt.
      thud(x) {
        if (!ready()) return;

        tone({ f0: 95, f1: 38, dur: 0.35, peak: 0.6, pan: p });
        burst({ dur: 0.4, f0: 700, f1: 120, peak: 0.45, pan: p });
      },
      // Rock into concrete; sections that break add falling debris and a rumble.
      crunch(x, killed) {
        if (!ready()) return;
        const p = panOf(x);
        tone({ f0: 75, f1: 40, dur: 0.3, peak: 0.6, pan: p });
        burst({ dur: 0.22, filter: "bandpass", f0: 2200, f1: 500, q: 1.2, peak: 0.55, pan: p });

        }
      },
      // A section set down by the crane (or dropping after a hit).

        if (!ready() || ac.currentTime - lastClank < 0.08) return;
        lastClank = ac.currentTime;
        const p = panOf(x);
        tone({ f0: 95, f1: 50, dur: 0.22, peak: 0.14, pan: p, bus: siteBus });
        tone({ type: "triangle", f0: 430, f1: 410, dur: 0.35, peak: 0.035, attack: 0.002, pan: p, bus: siteBus });
        burst({ dur: 0.08, filter: "bandpass", f0: 1400, q: 1.5, peak: 0.08, pan: p, bus: siteBus });
      },
      // Air brakes as a delivery parks.
      truckStop(x) {
        if (!ready()) return;
        const p = panOf(x);
        burst({ dur: 0.7, filter: "highpass", f0: 2600, peak: 0.06, attack: 0.01, pan: p, bus: siteBus });
        tone({ f0: 120, f1: 70, dur: 0.3, peak: 0.06, pan: p, bus: siteBus });
      },
      // A loaded truck taking a direct hit.
      cargoWreck(x) {
        if (!ready()) return;
        const p = panOf(x);
        tone({ f0: 90, f1: 34, dur: 0.5, peak: 0.7, pan: p });
        burst({ dur: 0.6, filter: "bandpass", f0: 2400, f1: 400, q: 1, peak: 0.6, pan: p });
        [[420, 0.12], [930, 0.08], [1490, 0.05]].forEach(([f, pk]) => tone({ type: "triangle", f0: f, f1: f * 0.98, dur: 1.1, peak: pk, pan: p }));

      },
      // Chainsaw revving through a trunk.
      chainsaw(x) {

        g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.04, t + 0.08); g.gain.setValueAtTime(0.04, t + len - 0.2); g.gain.exponentialRampToValueAtTime(0.0001, t + len);

        burst({ time: t + 0.2, dur: 0.6, filter: "bandpass", f0: 3000, q: 1, peak: 0.025, attack: 0.05, pan: p, bus: siteBus });
      },
      // Trunk creaks over and hits the ground.
      treeFall(x) {
        if (!ready()) return;
        const p = panOf(x);
        tone({ type: "sawtooth", f0: 240, f1: 110, dur: 0.4, peak: 0.02, attack: 0.05, cut: 900, pan: p, bus: siteBus });
        tone({ at: 0.05, f0: 80, f1: 35, dur: 0.4, peak: 0.2, pan: p, bus: siteBus });
        burst({ at: 0.05, dur: 0.6, f0: 2500, f1: 300, peak: 0.08, pan: p, bus: siteBus });
      },
      // Rock off a steel crane: inharmonic ring.
      clang(x) {
        if (!ready()) return;
        const p = panOf(x);
        [[523, 0.16], [1187, 0.1], [1766, 0.07], [2630, 0.04]].forEach(([f, pk]) =>
          tone({ type: "triangle", f0: f, f1: f * 0.985, dur: 1.3, peak: pk, attack: 0.002, pan: p }));
        burst({ dur: 0.06, filter: "highpass", f0: 3000, peak: 0.35, pan: p });
      },
      // Whole building coming down.
      collapse() {
        if (!ready()) return;
        const p = panOf(1280);
        burst({ dur: 3.2, f0: 220, f1: 50, peak: 0.8, attack: 0.15, pan: p });
        tone({ f0: 55, f1: 28, dur: 2.6, peak: 0.5, attack: 0.2, pan: p });
        for (let i = 0; i < 30; i++)
          burst({ at: Math.random() * 2.6, dur: 0.05 + Math.random() * 0.1, filter: "bandpass", f0: 800 + Math.random() * 2500, q: 2, peak: 0.1 + Math.random() * 0.2, pan: p + (Math.random() - 0.5) * 0.5 });
      },
      // Crane tower hitting the ground.
      crash(x) {
        if (!ready()) return;
        const p = panOf(x);
        tone({ f0: 70, f1: 30, dur: 0.6, peak: 0.7, pan: p });
        burst({ dur: 0.7, f0: 1200, f1: 150, peak: 0.6, pan: p });
        [[310, 0.12], [740, 0.07], [1130, 0.05]].forEach(([f, pk]) => tone({ type: "triangle", f0: f, f1: f * 0.97, dur: 0.9, peak: pk, pan: p }));
      },
    };
  })();

  // ---------- Static scenery (seeded, shared across rounds) ----------
  const sr = mulberry(4471);
  const farHills = [], nearHills = [], treeline = [], tufts = [], stars = [];
  for (let x = 0; x <= W + 20; x += 20) {
    farHills.push([x, 468 + Math.sin(x * 0.004) * 42 + Math.sin(x * 0.011 + 1) * 22 + sr() * 5]);
    nearHills.push([x, 548 + Math.sin(x * 0.006 + 2) * 28 + Math.sin(x * 0.017) * 11]);

  // ---------- Building ----------
  const standing = () => S.cols.reduce((n, c) => n + c.length, 0);

  function updCrane(dt) {
    const cr = S.crane, tk = S.truck, C = cycleTime();

      if (u >= 1) { cr.col = nextCol(); setPhase("toSite", craneAim(colX(cr.col), 0)); }
    } else if (cr.phase === "toSite") {

  function placeBlock(c) {

    const top = GROUND - (col.length + 1) * BH;

  // ---------- Update ----------
  function update(dt) {

  function updBuild(dt) {

      [0.5, "Server racks going in. Nobody asked the deer."],
      [0.75, "Substation energized: 140 MW on order"],
      [0.9, "Commissioning begins. Last chance."],

  let collapseAcc = 0;
  function updCollapse(dt) {

  // ---------- Draw ----------

    for (const t of S.trees) objs.push([t.y, () => drawTree(t)]);
    for (const a of S.animals) if (a.mode !== "gone" && !(a.kind === "heron" && a.mode !== "home")) objs.push([a.y, () => drawAnimal(a)]);

    objs.push([GROUND - 1, drawBuilding]);

    objs.sort((a, b) => a[0] - b[0]);
    for (const o of objs) o[1]();

    for (const a of S.animals) if (a.kind === "heron" && a.mode !== "home" && a.mode !== "gone") drawAnimal(a);

  function drawSky() {

        for (let i = 0; i < cr.carry; i++) drawBlock(tx + swing - BW / 2, hookY + 12 + i * (BH - 2), { hp: BLOCK_HP, flash: 0 }, 1, i);
      }
    }
    ctx.restore();
  }
  function drawDozer() {
    const d = S.dozer, k = 1.02;
    ctx.save(); ctx.translate(d.x, 812); ctx.scale(d.dir * -k, k);
    ctx.fillStyle = TN("#2b2b28"); ctx.beginPath(); ctx.roundRect(-40, -16, 80, 16, 8); ctx.fill();
    ctx.fillStyle = TN("#555"); for (let i = 0; i < 5; i++) ell(-30 + i * 15, -8, 4, 4);
    ctx.fillStyle = TN("#f2b233"); ctx.fillRect(-30, -40, 56, 24); ctx.fillRect(-20, -64, 30, 24);
    ctx.fillStyle = TN("#9bc6d6"); ctx.fillRect(-15, -60, 20, 12);
    ctx.fillStyle = TN("#7a7d77"); ctx.fillRect(-52, -34, 8, 32);
    ctx.strokeStyle = TN("#2b2b28"); ctx.lineWidth = 3; line(-44, -20, -30, -26);
    ctx.fillStyle = TN("#2b2b28"); ctx.fillRect(18, -54, 4, 16);
    ctx.restore();
  }
  function drawTruck() {
    const t = S.truck, jolt = t.hit > 0 ? Math.sin(S.time * 60) * 4 * t.hit : 0;
    ctx.save(); ctx.translate(t.x + jolt, TRUCK_Y);
    // Flatbed with the sections it's carrying, stacked two per row.
    ctx.fillStyle = TN("#2b2b28"); ell(-44, -11, 12, 12); ell(28, -11, 12, 12); ell(52, -11, 12, 12);
    ctx.fillStyle = TN("#5a6169"); ctx.fillRect(-30, -30, 92, 10);
    ctx.fillStyle = TN(t.wrecked ? "#7c5348" : "#e2e2dc"); ctx.fillRect(-66, -56, 38, 36);
    ctx.fillStyle = TN("#9bc6d6"); ctx.fillRect(-62, -52, 20, 15);
    ctx.fillStyle = TN("#2b2b28"); ctx.fillRect(-30, -46, 5, 18);
    for (let i = 0; i < t.cargo; i++) {
      const row = i >> 1, cx = -22 + (i % 2) * 40, cy = -34 - row * 11;
      ctx.fillStyle = TN(row % 2 ? "#b1b5ad" : "#bcc0b8"); ctx.fillRect(cx, cy - 10, 36, 10);
      ctx.strokeStyle = TN("#7e847d"); ctx.lineWidth = 1; ctx.strokeRect(cx + 0.5, cy - 9.5, 35, 9);
      ctx.fillStyle = TN("#949a92"); ctx.fillRect(cx + 4, cy - 7, 28, 2);
    }
    if (t.cargo > 0) { ctx.strokeStyle = TN("#3a3e3a"); ctx.lineWidth = 1.5; line(-24, -30, -24, -34 - (t.cargo >> 1) * 11); line(56, -30, 56, -34 - (t.cargo >> 1) * 11); }
    if (t.wrecked) {
      ctx.fillStyle = "rgba(40,36,32,.55)"; ctx.fillRect(-30, -32, 92, 6);
      ctx.strokeStyle = TN("#3a3e3a"); ctx.lineWidth = 2; line(-10, -30, 6, -44); line(20, -30, 34, -42);
    }
    ctx.restore();
  }
  function drawWorker(w) {
    ctx.save(); ctx.translate(w.x, 800 + (w.tx | 0) % 3 * 5);
    ctx.scale(w.dir, 1);
    ctx.strokeStyle = TN("#2f3a4a"); ctx.lineWidth = 3; ctx.lineCap = "round";
    const s = Math.sin(w.ph) * 5; line(0, -12, -s, 0); line(0, -12, s, 0);
    ctx.fillStyle = TN("#f2762e"); ctx.fillRect(-4, -26, 8, 14);
    ctx.fillStyle = TN("#e3c09a"); ell(0, -30, 3.5, 3.5);
    ctx.fillStyle = TN("#f2d233"); ctx.beginPath(); ctx.arc(0, -32, 4.5, Math.PI, 0); ctx.fill();
    ctx.restore();
  }
  function drawFence() {
    ctx.save(); ctx.globalAlpha = S.fenceA;
    ctx.strokeStyle = TN("#8a8f88"); ctx.lineWidth = 3;
    for (let x = 1010; x <= 1600; x += 34) line(x, 846, x, 806);
    line(1010, 808, 1600, 808);
    ctx.strokeStyle = "rgba(150,155,148,.45)"; ctx.lineWidth = 1;
    for (let x = 1010; x < 1600; x += 9) { line(x, 846, x + 30, 810); line(x + 30, 846, x, 810); }
    // sign board
    ctx.fillStyle = TN("#5b4a36"); ctx.fillRect(1044, 790, 4, 62); ctx.fillRect(1206, 790, 4, 62);
    ctx.fillStyle = TN("#f3edd8"); ctx.fillRect(1030, 772, 194, 50);
    ctx.fillStyle = TN("#f2b233"); ctx.fillRect(1030, 772, 194, 12);
    ctx.fillStyle = TN("#1b1f1a"); ctx.font = "700 8px 'IBM Plex Mono', monospace"; ctx.fillText("COMING SOON · PERMIT DC-4471", 1038, 781);
    ctx.font = "700 15px 'IBM Plex Mono', monospace"; ctx.fillText("NIMBUS DATA", 1038, 802);
    ctx.font = "600 9px 'IBM Plex Mono', monospace"; ctx.fillText("HYPERSCALE CAMPUS · 140 MW", 1038, 815);
    ctx.restore();
  }
  function drawFish() {
    for (const f of S.fish) {
      const x = f.x + f.dir * (f.t - 0.5) * 30, y = f.y - Math.sin(f.t * Math.PI) * 34;
      ctx.save(); ctx.translate(x, y); ctx.rotate(f.dir * (f.t - 0.5) * 2.2); ctx.scale(f.dir, 1);
      ctx.fillStyle = "#d9b27a"; ell(0, 0, 8, 3);
      ctx.beginPath(); ctx.moveTo(-7, 0); ctx.lineTo(-13, -4); ctx.lineTo(-13, 4); ctx.fill();
      ctx.restore();
      if (f.t < 0.12 || f.t > 0.88) { ctx.fillStyle = "rgba(230,248,255,.8)"; ell(f.x + f.dir * (f.t > 0.5 ? 15 : -15), f.y, 7, 2); }
    }
  }
  function drawBirds() {
    const f = S.flock; if (f.mode === "gone") return;
    ctx.strokeStyle = T("#2f3a36", 0.4, 0.2); ctx.lineWidth = 2; ctx.lineCap = "round";
    for (const b of f.birds) {
      const x = f.cx + b.ox + Math.sin(S.time + b.ph) * 8, y = f.cy + b.oy + Math.cos(S.time * 0.8 + b.ph) * 5, w = Math.sin(b.ph) * 5;
      ctx.beginPath(); ctx.moveTo(x - 8, y - w); ctx.quadraticCurveTo(x - 3, y - 2, x, y); ctx.quadraticCurveTo(x + 3, y - 2, x + 8, y - w); ctx.stroke();
    }
  }
  function drawButterflies() {
    for (const b of S.butterflies) {
      if (b.a <= 0) continue;
      const x = b.hx + Math.sin(b.ph * 0.9) * 40, y = b.hy + Math.sin(b.ph * 1.7) * 18 - 20, f = Math.abs(Math.sin(b.ph * 14));
      ctx.globalAlpha = b.a; ctx.fillStyle = b.hx % 2 < 1 ? "#f2c14e" : "#efe9ff";
      ell(x - 3, y, 3.5 * f + 0.5, 3); ell(x + 3, y, 3.5 * f + 0.5, 3);
    }
    ctx.globalAlpha = 1;
  }
  function drawRockAt(x, y, rot) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
    ctx.fillStyle = TN("#7d7468"); ctx.beginPath();
    ctx.moveTo(11, 0); ctx.lineTo(6, 9); ctx.lineTo(-5, 10); ctx.lineTo(-11, 2); ctx.lineTo(-7, -9); ctx.lineTo(5, -10); ctx.closePath(); ctx.fill();
    ctx.fillStyle = TN("#a39a8c"); ell(-2, -4, 4, 3);
    ctx.fillStyle = TN("#5d564d"); ell(4, 4, 2.5, 2);
    ctx.restore();
  }
  function drawRocks() {
    for (const r of S.rocks) {
      ctx.strokeStyle = "rgba(240,230,210,.35)"; ctx.lineWidth = 3; ctx.beginPath();
      r.trail.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y))); ctx.stroke();
      drawRockAt(r.x, r.y, r.rot);
    }
  }
  function drawParticles() {
    for (const p of S.particles) {
      if (p.type === "chunk") {
        ctx.globalAlpha = clamp(p.life); ctx.fillStyle = TN(p.c);
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * 0.8); ctx.restore();
      } else if (p.type === "dust") {
        ctx.globalAlpha = clamp(p.life / p.max) * 0.5; ctx.fillStyle = TN("#cbbd9f"); ell(p.x, p.y, p.r, p.r * 0.75);
      } else if (p.type === "spark") {
        ctx.globalAlpha = clamp(p.life * 3); ctx.strokeStyle = "#ffd36b"; ctx.lineWidth = 2; line(p.x, p.y, p.x - p.vx * 0.02, p.y - p.vy * 0.02);
      } else if (p.type === "leaf") {
        ctx.globalAlpha = clamp(p.life); ctx.fillStyle = T(p.c); ell(p.x, p.y, 3, 1.6, p.seed + S.time * 3);
      } else if (p.type === "steam") {
        ctx.globalAlpha = clamp(p.life / p.max) * 0.35; ctx.fillStyle = "#dfe6ea"; ell(p.x, p.y, p.r, p.r);
      }
    }
    ctx.globalAlpha = 1;
  }
  // Flight path with no wind: what the crew can predict, the weather is on you.
  function predict() {
    const a = (S.aim.angle * Math.PI) / 180, v = S.aim.power * VMAX;
    let x = LAUNCH.x, y = LAUNCH.y, vx = Math.cos(a) * v, vy = -Math.sin(a) * v;
    const pts = [], h = 1 / 90;
    for (let i = 0; i < 900; i++) {
      vy += GRAV * h; x += vx * h; y += vy * h;
      if (i % 6 === 0) pts.push([x, y]);
      if (y >= GROUND + 6 || blockAt(x + 10, y) || blockAt(x, y + 10) || x > W + 60) { pts.push([x, y]); return { pts, x, y }; }
    }
    return { pts, x, y };
  }
  function drawAim() {
    if (!canPlay() || !S.loaded || S.arm.mode !== "rest") return;
    const { pts, x: lx, y: ly } = predict();
    pts.forEach(([x, y], i) => {
      const u = i / pts.length, r = 3.4 - u * 1.2;
      ctx.globalAlpha = 0.28 - u * 0.1; ctx.fillStyle = "#1d2a1f"; ell(x + 1.5, y + 1.5, r, r);
      ctx.globalAlpha = 0.95 - u * 0.3; ctx.fillStyle = "#fffaf0"; ell(x, y, r, r);
    });
    // Landing ring, flattened where it sits on the ground.
    ctx.globalAlpha = 0.9; ctx.strokeStyle = "#f2b233"; ctx.lineWidth = 2.5;
    const onGround = ly >= GROUND - 2;
    ctx.beginPath();
    ctx.ellipse(lx, Math.min(ly, GROUND + 6), 17, onGround ? 6 : 15, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.beginPath(); ctx.moveTo(lx - 7, Math.min(ly, GROUND + 6)); ctx.lineTo(lx + 7, Math.min(ly, GROUND + 6)); ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.font = "600 17px 'IBM Plex Mono', monospace";
    const label = `${Math.round(S.aim.angle)}° · ${Math.round(S.aim.power * 100)}%`;
    const tw = ctx.measureText(label).width;
    ctx.fillStyle = "rgba(18,24,19,.72)"; ctx.fillRect(TX - 40, 358, tw + 20, 28);
    ctx.fillStyle = "#f2b233"; ctx.fillText(label, TX - 30, 378);
  }
  // Where the previous rock actually came down, wind and all.
  function drawLastShot() {
    const s = S.lastShot; if (!s || s.t <= 0) return;
    ctx.save();
    ctx.globalAlpha = clamp(s.t / 2) * 0.75;
    ctx.strokeStyle = "#e8dcc2"; ctx.lineWidth = 2; ctx.setLineDash([5, 5]);
    ctx.beginPath(); ctx.ellipse(s.x, s.y, 14, s.y >= GROUND - 2 ? 5 : 13, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.setLineDash([]);
    ctx.font = "600 12px 'IBM Plex Mono', monospace"; ctx.fillStyle = "#e8dcc2";
    ctx.fillText("last shot", s.x - 26, s.y - 20);
    ctx.restore();
  }
  function drawNightLights() {
    ctx.save(); ctx.globalCompositeOperation = "lighter";
    for (let c = 0; c < COLS; c++) for (let i = 0; i < S.cols[c].length; i++) {
      const x = BX + c * BW + 14, y = GROUND - (i + 1) * BH + BH - 8;
      const g = ctx.createRadialGradient(x, y, 0, x, y, 16);
      g.addColorStop(0, `rgba(92,225,230,${0.45 * S.night})`); g.addColorStop(1, "rgba(92,225,230,0)");
      ctx.fillStyle = g; ctx.fillRect(x - 16, y - 16, 32, 32);
    }
    const fg = ctx.createRadialGradient(BX + 190, GROUND - 150, 20, BX + 190, GROUND - 150, 420);
    fg.addColorStop(0, `rgba(170,210,255,${0.18 * S.night})`); fg.addColorStop(1, "rgba(170,210,255,0)");
    ctx.fillStyle = fg; ctx.fillRect(BX - 250, GROUND - 570, 900, 840);
    ctx.restore();
  }

  // ---------- HUD ----------
  const last = {};
  function setText(id, v) { if (last[id] !== v) { last[id] = v; $(id).textContent = v; } }
  function setWidth(id, v) { const key = id + ":w"; if (last[key] !== v) { last[key] = v; $(id).style.width = v; } }
  function hud() {
    const st = standing();
    setText("buildPct", Math.round((st / N) * 100) + "%");
    setWidth("buildBar", ((st / N) * 100).toFixed(1) + "%");
    setText("buildSub", S.halt > 0 && S.state === "build" ? `Crane jammed · ${S.halt.toFixed(1)} s` : `${st} / ${N} sections standing`);
    setText("budgetVal", money(S.budget));
    setWidth("budgetBar", ((S.budget / S.budget0) * 100).toFixed(1) + "%");
    const kmh = Math.round(Math.abs(S.wind) / 3);
    setText("windVal", kmh < 2 ? "calm" : `${S.wind > 0 ? "→" : "←"} ${kmh} km/h`);
    const ready = canPlay() && S.loaded;
    setText("reloadVal", !canPlay() ? "Standing by" : ready ? "Rock loaded" : "Reloading…");
    const rl = $("reloadVal"); if (rl.classList.contains("ready") !== ready) rl.classList.toggle("ready", ready);
  }

  // ---------- Boot ----------
  newWorld(savedDiff);
  resize();
  showOverlay("title");
  let prev = performance.now();
  function loop(now) {
    const dt = Math.min(0.05, (now - prev) / 1000); prev = now;
    update(dt); draw(); hud(); Sfx.ambient(dt);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
